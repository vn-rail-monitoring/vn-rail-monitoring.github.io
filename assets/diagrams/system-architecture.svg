</defs><style>text{font-family:Arial,'DejaVu Sans',sans-serif;} .title{fill:#0D2142;font-size:34px;font-weight:700;} .subtitle{fill:#5E738E;font-size:19px;} .h{fill:#102B4B;font-size:23px;font-weight:700;} .body{fill:#49657F;font-size:19px;} .sm{fill:#608098;font-size:16px;} .white{fill:#fff;} .mono{font-family:monospace;}</style><rect x="0" y="0" width="1500" height="755" rx="0" fill="#F7FBFF" stroke="none" /><text x="55" y="64" class="title">KIẾN TRÚC HỆ THỐNG ĐỀ XUẤT</text><text x="55" y="103" class="subtitle">Mô hình khái quát từ thiết bị trên tàu đến phần mềm trung tâm</text><rect x="55" y="150" width="400" height="493" rx="24" fill="#FFFFFF" stroke="#D5E6F1" filter="url(#shadow)"/><rect x="55" y="150" width="400" height="10" rx="5" fill="#0284C7" stroke="none" /><text x="84" y="209" class="h">01  THIẾT BỊ TRÊN TÀU</text><text x="85" y="243" class="sm">Thu thập và tiền xử lý dữ liệu</text><rect x="83" y="278" width="343" height="66" rx="14" fill="#ECF7FC" stroke="none" /><circle cx="114" cy="310" r="19" fill="#CCEDF8"/><text x="149" y="307" class="h" font-size="18">GPS/GNSS</text><text x="149" y="330" class="sm">Thông tin định vị</text><rect x="83" y="360" width="343" height="66" rx="14" fill="#ECF7FC" stroke="none" /><circle cx="114" cy="392" r="19" fill="#CCEDF8"/><text x="149" y="389" class="h" font-size="18">IMU và cảm biến rung</text><text x="149" y="412" class="sm">Dữ liệu chuyển động</text><rect x="83" y="442" width="343" height="66" rx="14" fill="#ECF7FC" stroke="none" /><circle cx="114" cy="474" r="19" fill="#CCEDF8"/><text x="149" y="471" class="h" font-size="18">Camera AI</text><text x="149" y="494" class="sm">Dữ liệu hình ảnh</text><rect x="83" y="524" width="343" height="66" rx="14" fill="#ECF7FC" stroke="none" /><circle cx="114" cy="556" r="19" fill="#CCEDF8"/><text x="149" y="553" class="h" font-size="18">Máy tính nhúng</text><text x="149" y="576" class="sm">IoT Gateway</text><rect x="520" y="272" width="230" height="215" rx="24" fill="#E7F7FC" stroke="#B6DEED" /><text x="635" y="340" class="h" text-anchor="middle">02  KẾT NỐI</text><text x="635" y="385" class="h" fill="#075985" font-size="32" text-anchor="middle">3G / 4G</text><text x="635" y="420" class="sm" text-anchor="middle">Truyền dữ liệu</text><path d="M455 378 H519" stroke="#0E7490" stroke-width="5" marker-end="url(#arrow)"/><path d="M750 378 H819" stroke="#0E7490" stroke-width="5" marker-end="url(#arrow)"/><rect x="820" y="150" width="620" height="493" rx="24" fill="#FFFFFF" stroke="#D5E6F1" filter="url(#shadow)"/><rect x="820" y="150" width="620" height="10" rx="5" fill="#0D9488" stroke="none" /><text x="850" y="209" class="h">03  PHẦN MỀM TRUNG TÂM</text><text x="850" y="244" class="sm">Tiếp nhận, quản lý và trực quan hóa dữ liệu</text><rect x="850" y="285" width="262" height="126" rx="17" fill="#F0F8FC" stroke="#DFECF3" /><text x="868" y="333" class="h" font-size="18">Tiếp nhận &amp; xử lý</text><text x="868" y="366" class="sm" font-size="15">Dữ liệu hành trình</text><rect x="1135" y="285" width="262" height="126" rx="17" fill="#F0F8FC" stroke="#DFECF3" /><text x="1153" y="333" class="h" font-size="18">GIS / Bản đồ số</text><text x="1153" y="366" class="sm" font-size="15">Vị trí, trạng thái đoàn tàu</text><rect x="850" y="440" width="262" height="126" rx="17" fill="#F0F8FC" stroke="#DFECF3" /><text x="868" y="488" class="h" font-size="18">AI hỗ trợ</text><text x="868" y="521" class="sm" font-size="15">Dự báo, phát hiện bất thường</text><rect x="1135" y="440" width="262" height="126" rx="17" fill="#F0F8FC" stroke="#DFECF3" /><text x="1153" y="488" class="h" font-size="18">API &amp; quản trị</text><text x="1153" y="521" class="sm" font-size="15">Kết nối hệ thống, báo cáo</text><text x="57" y="705" class="sm">Minh họa kiến trúc từ phụ lục nhiệm vụ • Không phải bản thiết kế kỹ thuật chi tiết</text></svg>